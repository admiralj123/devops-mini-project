<!-- src/app/pages/login/login.html -->
<div class="login-container">
  <div class="login-card">
    <h2>Connexion à Todo App</h2>
    <p class="subtitle">Gérez vos tâches efficacement</p>
    
    <!-- تحذير إذا كان الخادم غير متوفر -->
    <div *ngIf="!serverAvailable" class="server-warning">
      ⚠️ <strong>Attention:</strong> Serveur Spring Boot non disponible.
      <br>
      Vérifiez que le serveur tourne sur <code>http://localhost:8080</code>
    </div>
    
    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Nom d'utilisateur *</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="credentials.username"
          required
          placeholder="Votre nom d'utilisateur"
          class="form-control"
          [class.error]="errorMessage && !credentials.username"
          [disabled]="!serverAvailable"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe *</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="credentials.password"
          required
          placeholder="Votre mot de passe"
          class="form-control"
          [class.error]="errorMessage && !credentials.password"
          [disabled]="!serverAvailable"
        />
      </div>

      <!-- إزالة حقل email لأن Spring Boot لا يحتاجه لتسجيل الدخول -->
      
      <button 
        type="submit" 
        class="btn-primary"
        [disabled]="isLoading || !loginForm.form.valid || !serverAvailable"
      >
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading" class="loading">
          <span class="spinner"></span> Connexion en cours...
        </span>
      </button>
    </form>

    <div class="links">
      <p>Première fois ici ? <a routerLink="/register">Créer un compte</a></p>
    </div>

    <!-- عرض رسائل الخطأ -->
    <div *ngIf="errorMessage" class="error-message">
      ⚠️ {{ errorMessage }}
    </div>

    <!-- زر لإعادة المحاولة إذا كان الخادم غير متوفر -->
    <div *ngIf="!serverAvailable" class="retry-section">
      <button (click)="checkServer()" class="btn-retry">
        🔄 Réessayer la connexion au serveur
      </button>
    </div>
  </div>
</div>
