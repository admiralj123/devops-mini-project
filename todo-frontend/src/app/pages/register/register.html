<div class="register-container">
  <div class="register-card">
    <h2>Créer un compte</h2>
    <p class="subtitle">Commencez à gérer vos tâches dès aujourd'hui</p>
    
    <form (ngSubmit)="register()" #registerForm="ngForm">
      <div class="form-group">
        <label for="username">Nom d'utilisateur *</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="userData.username"
          required
          placeholder="Choisissez un nom d'utilisateur"
          class="form-control"
          minlength="3"
        />
        <small class="hint">Minimum 3 caractères</small>
      </div>

      <div class="form-group">
        <label for="email">Adresse email *</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="userData.email"
          required
          placeholder="votre@email.com"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe *</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="userData.password"
          required
          placeholder="Créez un mot de passe sécurisé"
          class="form-control"
          minlength="6"
        />
        <small class="hint">Minimum 6 caractères</small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe *</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          placeholder="Retapez votre mot de passe"
          class="form-control"
          [class.error]="userData.password && userData.password !== confirmPassword"
        />
        <small *ngIf="userData.password && userData.password !== confirmPassword" 
               class="error-hint">
          ⚠️ Les mots de passe ne correspondent pas
        </small>
      </div>

      <button 
        type="submit" 
        class="btn-primary"
        [disabled]="isLoading || !registerForm.form.valid || userData.password !== confirmPassword"
      >
        <span *ngIf="!isLoading">S'inscrire</span>
        <span *ngIf="isLoading" class="loading">
          <span class="spinner"></span> Inscription...
        </span>
      </button>
    </form>

    <div class="links">
      <p>Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      ⚠️ {{ errorMessage }}
    </div>
  </div>
</div>
