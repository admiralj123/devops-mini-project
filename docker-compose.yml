version: '3.8'

services:
  # ===== قاعدة البيانات PostgreSQL (باستخدام Dockerfile) =====
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: amine123hajji/todo-db:latest  # اسم الصورة التي ستنشئها
    container_name: todo-database
    restart: unless-stopped
    environment:
      - POSTGRES_DB=todo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - todo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Backend Spring Boot =====
  backend:
    build:
      context: ./backend/todo-backend
      dockerfile: Dockerfile
    image: amine123hajji/my-backend:latest
    container_name: todo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    environment:
      # اتصال قاعدة البيانات
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/todo_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      
      # إعدادات JPA/Hibernate
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      
      # CORS للـ Frontend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      
      # Server
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - todo-network

  # ===== Frontend Angular =====
  frontend:
    build:
      context: ./todo-frontend
      dockerfile: Dockerfile
    image: amine123hajji/my-frontend:latest
    container_name: todo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - API_URL=http://localhost:8080/api
    networks:
      - todo-network

# ===== الشبكة المشتركة =====
networks:
  todo-network:
    driver: bridge

# ===== وحدات التخزين =====
volumes:
  postgres_data: